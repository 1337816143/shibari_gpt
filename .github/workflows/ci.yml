name: CI

on:
  pull_request:
  push:
    branches: [main, 'agent/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:models
      - run: npm run test
      - run: npm run build

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

  generate-mpfb-candidate:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'agent/phase-1-3d-poc' &&
      github.event.pull_request.head.ref == 'agent/mpfb-run-1'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLENDER_VERSION: '4.5.12'
      BLENDER_HOME: ${{ runner.temp }}/blender-home
      OUTPUT_DIR: ${{ runner.temp }}/mpfb-candidate
    steps:
      - uses: actions/checkout@v6
      - name: Generate reproducible technical-review candidate
        run: bash tools/blender/run_candidate_pipeline.sh
      - name: Upload candidate or failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-adult-female-candidate
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 7
