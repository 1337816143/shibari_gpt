name: CI

on:
  pull_request:
  push:
    branches: [main, 'agent/**']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:models
      - run: npm run test
      - run: npm run build
      - run: npm run verify:bundle

  gate:
    runs-on: ubuntu-latest
    outputs:
      apply_requested: ${{ steps.marker.outputs.apply_requested }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - id: marker
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[apply-catalog-ui]'; then
            echo 'apply_requested=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply_requested=false' >> "$GITHUB_OUTPUT"
          fi

  apply_catalog_ui:
    name: Apply catalog UI source bundle
    needs: [validate, gate]
    if: needs.validate.result == 'success' && needs.gate.outputs.apply_requested == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out writable development branch
        uses: actions/checkout@v6
        with:
          ref: agent/phase-1-3d-poc
          fetch-depth: 0
      - name: Verify and apply source bundle
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patch_parts=(tools/patches/catalog-ui-final.tar.gz.b64.part-*)
          test "${#patch_parts[@]}" -eq 5
          cat "${patch_parts[@]}" > "$RUNNER_TEMP/catalog-ui-final.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/catalog-ui-final.tar.gz.b64" > "$RUNNER_TEMP/catalog-ui-final.tar.gz"
          sha256sum "$RUNNER_TEMP/catalog-ui-final.tar.gz"
          gzip --test "$RUNNER_TEMP/catalog-ui-final.tar.gz"

          mapfile -t members < <(tar -tzf "$RUNNER_TEMP/catalog-ui-final.tar.gz")
          test "${#members[@]}" -eq 23
          expected=(
            '.github/workflows/ci.yml'
            '.github/workflows/pages.yml'
            'README.md'
            'docs/architecture.md'
            'docs/completion-status.md'
            'docs/model-pipeline/asset-acceptance-checklist.md'
            'docs/model-pipeline/candidate-catalog.md'
            'docs/model-pipeline/phase4-asset-pipeline.md'
            'public/models/README.md'
            'scripts/verify-model-assets.mjs'
            'src/App.tsx'
            'src/components/ui/AssetTransparencyPanel.tsx'
            'src/components/ui/asset-transparency.css'
            'src/data/demoCourse.ts'
            'src/data/model-assets.json'
            'src/data/modelAssets.ts'
            'src/schemas/course.ts'
            'tests/app.test.tsx'
            'tests/course-schema.test.ts'
            'tests/e2e/studio.spec.ts'
            'tools/blender/audit_glb_candidate.py'
            'tools/blender/generate_mpfb_candidate.py'
            'tools/blender/run_candidate_pipeline.sh'
          )
          printf '%s\n' "${members[@]}" | sort > "$RUNNER_TEMP/actual-members.txt"
          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected-members.txt"
          diff -u "$RUNNER_TEMP/expected-members.txt" "$RUNNER_TEMP/actual-members.txt"

          tar -xzf "$RUNNER_TEMP/catalog-ui-final.tar.gz" -C .
          rm -f tools/patches/catalog-ui-final.tar.gz.b64.part-* .github/workflows/mpfb-candidate-ci.yml
          rmdir tools/patches 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: expose every MPFB candidate in the model selector'
          git push origin HEAD:agent/phase-1-3d-poc
