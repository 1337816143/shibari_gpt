name: CI

on:
  pull_request:
  push:
    branches: [main, 'agent/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:models
      - run: npm run test
      - run: npm run build
      - run: npm run verify:bundle

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run verify:bundle
      - run: npm run test:e2e

  candidate_gate:
    runs-on: ubuntu-latest
    outputs:
      requested: ${{ steps.commit.outputs.requested }}
      source_requested: ${{ steps.commit.outputs.source_requested }}
      head_sha: ${{ steps.commit.outputs.head_sha }}
    env:
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1
      - name: Inspect trigger markers
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%B)"
          head_sha="$(git rev-parse HEAD)"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          if grep -Fq '[mpfb-candidate]' <<< "$message"; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
            echo "MPFB candidate generation requested for $head_sha"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
            echo "No MPFB marker; heavy generation remains skipped."
          fi
          if grep -Fq '[source-export]' <<< "$message"; then
            echo "source_requested=true" >> "$GITHUB_OUTPUT"
            echo "Source snapshot requested for $head_sha"
          else
            echo "source_requested=false" >> "$GITHUB_OUTPUT"
          fi

  source_snapshot:
    name: Export source snapshot
    needs: [validate, candidate_gate]
    if: needs.validate.result == 'success' && needs.candidate_gate.outputs.source_requested == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact validated source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate_gate.outputs.head_sha }}
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=test-results \
            --exclude=playwright-report \
            -czf "$RUNNER_TEMP/shibari-source.tar.gz" .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: shibari-source-${{ github.run_id }}
          path: ${{ runner.temp }}/shibari-source.tar.gz
          retention-days: 1
          compression-level: 0

  mpfb_candidate:
    name: Generate MPFB technical candidate
    needs: [validate, candidate_gate]
    if: needs.validate.result == 'success' && needs.candidate_gate.outputs.requested == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BLENDER_VERSION: 4.5.12
    steps:
      - name: Check out exact validated source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.candidate_gate.outputs.head_sha }}
      - name: Record pipeline revision
        run: git rev-parse HEAD | tee "$RUNNER_TEMP/pipeline-sha.txt"
      - name: Check runner capacity
        run: |
          df -h
          free -h
      - name: Install headless rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 libgl1 libglx-mesa0 libxi6 libxkbcommon0 libxrender1 \
            libxrandr2 libxfixes3 libxinerama1 libxcursor1 libxxf86vm1 \
            libwayland-client0 libwayland-egl1 mesa-utils xz-utils
      - name: Generate MPFB candidate
        run: bash tools/blender/run_candidate_pipeline.sh
      - name: Validate candidate outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/shibari-mpfb/output"
          test -s "$output_dir/shibari-adult-female-candidate.glb"
          test -s "$output_dir/candidate-report.json"
          for view in front back left right; do
            test -s "$output_dir/preview-${view}.png"
          done
          cat "$output_dir/candidate-report.json"
          cat "$output_dir/SHA256.txt"
          du -ah "$output_dir" | sort -h | tail -30
      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpfb-technical-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/shibari-mpfb/output
            ${{ runner.temp }}/pipeline-sha.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
