name: Materialize project bundle

on:
  push:
    branches:
      - agent/phase-1-3d-poc
    paths:
      - '.bootstrap/**'
      - '.github/workflows/materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-1-3d-poc
          fetch-depth: 0

      - name: Decode and extract project
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/shibari-gpt.tar.gz.b64
          base64 --decode /tmp/shibari-gpt.tar.gz.b64 > /tmp/shibari-gpt.tar.gz
          tar -xzf /tmp/shibari-gpt.tar.gz -C .
          rm -rf .bootstrap .github/workflows/materialize.yml

      - name: Commit materialized project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build 3D teaching proof of concept"
          git push origin HEAD:agent/phase-1-3d-poc
