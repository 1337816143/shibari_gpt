name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ['agent/phase-1-3d-poc']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to deploy
        required: false
        default: agent/phase-1-3d-poc

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      SOURCE_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_ref || 'agent/phase-1-3d-poc' }}
    steps:
      - name: Check out validated site source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REF }}
      - name: Record source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run verify:bundle
      - name: Stamp deployed source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node -e "require('fs').writeFileSync('dist/deployment.json', JSON.stringify({ sha: process.env.SOURCE_SHA, deployWorkflowSha: process.env.GITHUB_SHA, workflowRun: process.env.GITHUB_RUN_ID, deployedAt: new Date().toISOString() }, null, 2) + '\n')"
      - name: Validate Pages artifact
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/models/rigged-figure-qa/RiggedFigure.glb
          for slug in mpfb-casual-mobile mpfb-casual-original mpfb-sports-original; do
            test -s "dist/models/${slug}/model.glb"
            test -s "dist/models/${slug}/preview-front.png"
            (cd "dist/models/${slug}" && sha256sum --check SHA256.txt)
          done
          test -s dist/models/mpfb-catalog-summary.json
          grep -Fq '<title>Shibari Studio · 3D 绳艺教学</title>' dist/index.html
          grep -Eq 'src="/shibari_gpt/assets/.+\.js"' dist/index.html
          grep -Eq 'href="/shibari_gpt/assets/.+\.css"' dist/index.html
          test "$(node -p "require('./dist/deployment.json').sha")" = "${SOURCE_SHA}"
          (cd dist/models/rigged-figure-qa && sha256sum --check SHA256.txt)
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify-public-site:
    name: Verify deployed site
    needs: [build, deploy]
    runs-on: ubuntu-latest
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
    steps:
      - name: Validate public commit and assets
        id: public
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for ${PAGE_URL} to expose ${SOURCE_SHA}"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "${PAGE_URL}deployment.json?acceptance=${SOURCE_SHA}-${attempt}" \
              --output deployment.json && \
              [ "$(node -p "require('./deployment.json').sha")" = "${SOURCE_SHA}" ]; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "Expected deployment ${SOURCE_SHA} was not observed." >&2
              cat deployment.json 2>/dev/null || true
              exit 1
            fi
            sleep 10
          done

          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "${PAGE_URL}?acceptance=${SOURCE_SHA}" \
            --output page.html
          curl --fail --silent --show-error --location --max-time 30 \
            "${PAGE_URL}404.html?acceptance=${SOURCE_SHA}" --output not-found.html

          grep -Fq '<title>Shibari Studio · 3D 绳艺教学</title>' page.html
          grep -Fq 'id="root"' page.html
          test -s not-found.html

          script_path="$(grep -oE 'src="/shibari_gpt/assets/[^"]+\.js"' page.html | head -1 | cut -d'"' -f2)"
          style_path="$(grep -oE 'href="/shibari_gpt/assets/[^"]+\.css"' page.html | head -1 | cut -d'"' -f2)"
          test -n "${script_path}"
          test -n "${style_path}"

          origin="$(printf '%s' "${PAGE_URL}" | sed -E 's#(https://[^/]+).*#\1#')"
          curl --fail --silent --show-error --location --max-time 30 "${origin}${script_path}" --output app.js
          curl --fail --silent --show-error --location --max-time 30 "${origin}${style_path}" --output app.css
          curl --fail --silent --show-error --location --max-time 30 \
            "${PAGE_URL}models/rigged-figure-qa/RiggedFigure.glb" --output RiggedFigure.glb
          curl --fail --silent --show-error --location --max-time 30 \
            "${PAGE_URL}models/rigged-figure-qa/SHA256.txt" --output SHA256.txt
          test -s app.js
          test -s app.css
          test -s RiggedFigure.glb
          sha256sum --check SHA256.txt

          for slug in mpfb-casual-mobile mpfb-casual-original mpfb-sports-original; do
            curl --fail --silent --show-error --location --max-time 180 \
              "${PAGE_URL}models/${slug}/model.glb" --output "${slug}.glb"
            curl --fail --silent --show-error --location --max-time 30 \
              "${PAGE_URL}models/${slug}/SHA256.txt" --output "${slug}.sha256"
            sed -E "s#  model\.glb#  ${slug}.glb#" "${slug}.sha256" > "${slug}.check"
            sha256sum --check "${slug}.check"
          done
          curl --fail --silent --show-error --location --max-time 30 \
            "${PAGE_URL}models/mpfb-catalog-summary.json" --output mpfb-catalog-summary.json
          test "$(node -p "require('./mpfb-catalog-summary.json').length")" = "3"

          echo "Public deployment accepted: ${PAGE_URL} (${SOURCE_SHA})"
      - name: Report deployment to Draft PR
        if: always()
        uses: actions/github-script@v9
        env:
          PUBLIC_OUTCOME: ${{ steps.public.outcome }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        with:
          script: |
            const marker = '<!-- pages-deployment-status -->';
            const success = process.env.PUBLIC_OUTCOME === 'success';
            const body = [
              marker,
              '## GitHub Pages deployment',
              '',
              `- Status: ${success ? '✅ publicly accepted' : '❌ public acceptance failed'}`,
              `- Source commit: \`${process.env.SOURCE_SHA}\``,
              `- Deployment run ID: \`${context.runId}\``,
              `- Public site: ${process.env.PAGE_URL}`,
              `- Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              success
                ? 'Acceptance checked the exact deployment fingerprint, homepage, 404 document, JavaScript, CSS, QA GLB, all three MPFB candidates, the catalog summary, and every GLB SHA-256 checksum.'
                : 'The deployment was not accepted as current; inspect this run before treating the public site as updated.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 1,
                body,
              });
            }
