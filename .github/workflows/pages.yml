name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ['agent/phase-1-3d-poc']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DEPLOY_REF: agent/phase-1-3d-poc

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out reviewed site source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_REF }}
      - name: Record source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Stamp deployed source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node -e "require('fs').writeFileSync('dist/deployment.json', JSON.stringify({ sha: process.env.SOURCE_SHA, deployWorkflowSha: process.env.GITHUB_SHA, workflowRun: process.env.GITHUB_RUN_ID, deployedAt: new Date().toISOString() }, null, 2) + '\n')"
      - name: Validate Pages artifact
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/404.html
          grep -Fq '<title>Shibari Studio · 3D 绳艺教学</title>' dist/index.html
          grep -Eq 'src="/shibari_gpt/assets/.+\.js"' dist/index.html
          grep -Eq 'href="/shibari_gpt/assets/.+\.css"' dist/index.html
          test "$(node -p "require('./dist/deployment.json').sha")" = "${SOURCE_SHA}"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify-public-site:
    name: Verify deployed site
    needs: [build, deploy]
    runs-on: ubuntu-latest
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
    steps:
      - name: Validate public commit and assets
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for ${PAGE_URL} to expose ${SOURCE_SHA}"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "${PAGE_URL}deployment.json?acceptance=${SOURCE_SHA}-${attempt}" \
              --output deployment.json && \
              [ "$(node -p "require('./deployment.json').sha")" = "${SOURCE_SHA}" ]; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "Expected deployment ${SOURCE_SHA} was not observed." >&2
              cat deployment.json 2>/dev/null || true
              exit 1
            fi
            sleep 10
          done

          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "${PAGE_URL}?acceptance=${SOURCE_SHA}" \
            --output page.html

          grep -Fq '<title>Shibari Studio · 3D 绳艺教学</title>' page.html
          grep -Fq 'id="root"' page.html

          script_path="$(grep -oE 'src="/shibari_gpt/assets/[^"]+\.js"' page.html | head -1 | cut -d'"' -f2)"
          style_path="$(grep -oE 'href="/shibari_gpt/assets/[^"]+\.css"' page.html | head -1 | cut -d'"' -f2)"
          test -n "${script_path}"
          test -n "${style_path}"

          origin="$(printf '%s' "${PAGE_URL}" | sed -E 's#(https://[^/]+).*#\1#')"
          curl --fail --silent --show-error --location --max-time 30 "${origin}${script_path}" --output app.js
          curl --fail --silent --show-error --location --max-time 30 "${origin}${style_path}" --output app.css
          test -s app.js
          test -s app.css

          echo "Public deployment accepted: ${PAGE_URL} (${SOURCE_SHA})"
